; Small by design: one household or a handful, not a web shop.
[www]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; The default format logs the script, which is /index.php for every Laravel
; request; the address and the duration say what was asked.
access.format = "%t \"%m %{REQUEST_URI}e\" %s %{mili}dms"
