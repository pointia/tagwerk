; Everything the application needs besides the database, in one container.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Lower priority starts first and stops last: on a rollout the old container
; keeps answering until queue and scheduler are gone and the container dies —
; only then does Traefik drop it. Stopped first, it would answer 502 meanwhile.
[program:php-fpm]
command=php-fpm --nodaemonize
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Push, list and calendar syncs. --max-time recycles the worker so a slow
; leak never grows for weeks. It then exits with 0, which supervisord's
; default (autorestart=unexpected) takes as done: without autorestart=true
; the queue stood still an hour after every start.
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopwaitsecs=60

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
