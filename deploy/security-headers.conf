# Included at server level AND in every location with its own add_header:
# nginx drops inherited add_header lines as soon as a location sets one.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Nothing the app uses; camera and files go through <input type=file>.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;
# A window opened from here, or one that opened us, gets no handle on the other.
add_header Cross-Origin-Opener-Policy "same-origin" always;
