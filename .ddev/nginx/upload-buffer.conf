# nginx buffers larger request bodies -- a photo in the admin panel, say --
# on disk. The default directory /var/lib/nginx/body belongs to `nobody`
# with mode 700 in the web container, but nginx runs as the project user:
# every upload beyond the memory buffer ended in a 500 ("Permission denied"
# in the nginx log), small files went through. /tmp is writable for all.
client_body_temp_path /tmp/nginx-client-body;
